name: makhraj
description: "Makhraj: aplikasi tahsin berbasis visualisasi makhraj."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  camera: ^0.12.1
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.1.2
  shared_preferences: ^2.5.6
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/quran/
  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: Naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-400.ttf
        - asset: assets/fonts/NotoNaskhArabic-700.ttf
          weight: 700
