<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Pasang tema sebelum render pertama agar tidak berkedip. Kunci sama dengan store.ts. -->
    <script>
      try {
        var t = ((JSON.parse(localStorage.getItem('makhraj-v1') || '{}').state || {}).pengaturan || {}).tema
        if (t !== 'terang' && t !== 'gelap') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'gelap' : 'terang'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name=theme-color]').content = t === 'gelap' ? '#0B1214' : '#FAF7F1'
      } catch (e) {}
    </script>
    <meta name="description" content="Makhraj: belajar huruf hijaiyah dari tempat keluarnya, dengan contoh guru bersanad." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Makhraj</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
