<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rekam dan Bandingkan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E5E}a:hover{color:#0A4444}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #FBF8F2; font-family: 'Plus Jakarta Sans', sans-serif; color: #1C2333; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="Pelajaran.dc.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E1D3; display: flex; align-items: center; justify-content: center; color: #1C2333">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 700">Rekam & bandingkan</span>
  </div>

  <div style="text-align: center; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 13px; color: #5A6070">Ucapkan</span>
    <span lang="ar" dir="rtl" style="font-family: 'Noto Naskh Arabic', serif; font-size: 52px; font-weight: 700; line-height: 1.4">أَبْ</span>
    <span style="font-size: 13px; color: #5A6070">ab · ba sukun, jangan lupa pantulannya</span>
  </div>

  <div style="height: 168px; border-radius: 20px; background: #2A3142; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <svg width="150" height="90" viewBox="0 0 150 90" aria-hidden="true">
      <path d="M10 45 C40 18 60 22 75 30 C90 22 110 18 140 45 C110 72 40 72 10 45 Z" fill="none" stroke="#E2A93B" stroke-width="3" stroke-dasharray="6 5"></path>
    </svg>
    <span style="position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 10px; background: #1C2333; color: #FFFFFF; font-size: 12px; font-weight: 600">Mode cermin</span>
    <span style="position: absolute; bottom: 12px; font-size: 12px; color: #C9CEDA">[Pratinjau kamera depan] · cocokkan bibirmu dengan garis</span>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E8E1D3; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Putar suara guru" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: #DCEDEA; color: #0F5E5E; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-size: 12px; font-weight: 700; color: #0F5E5E">Syaikh Aiman Suwaid</span>
        <div style="display: flex; align-items: center; gap: 3px; height: 32px">
          <sc-for list="{{guru}}" as="b" hint-placeholder-count="30">
            <span style="{{b}}"></span>
          </sc-for>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Putar rekamanmu" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: none; background: #F6E7C8; color: #7A520C; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </button>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-size: 12px; font-weight: 700; color: #7A520C">Rekamanmu</span>
        <sc-if value="{{recorded}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: center; gap: 3px; height: 32px">
            <sc-for list="{{saya}}" as="b" hint-placeholder-count="30">
              <span style="{{b}}"></span>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{notRecorded}}" hint-placeholder-val="{{false}}">
          <span style="height: 32px; display: flex; align-items: center; font-size: 13px; color: #5A6070">Belum ada rekaman</span>
        </sc-if>
      </div>
    </div>
  </div>

  <button type="button" onClick="{{toggle}}" style="height: 56px; border-radius: 16px; border: none; background: {{recBg}}; color: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    {{recLabel}}
  </button>

  <fieldset style="margin: 0; border: 1px solid #E8E1D3; border-radius: 20px; padding: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
    <legend style="padding: 0 6px; font-size: 14px; font-weight: 700">Cek sendiri bacaanmu</legend>
    <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer">
      <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0F5E5E">
      Kedua bibir tertutup rapat
    </label>
    <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer">
      <input type="checkbox" style="width: 20px; height: 20px; accent-color: #0F5E5E">
      Ada pantulan (qalqalah) di akhir
    </label>
    <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 14px; cursor: pointer">
      <input type="checkbox" style="width: 20px; height: 20px; accent-color: #0F5E5E">
      Tidak ada hembusan napas seperti "p"
    </label>
  </fieldset>

  <button type="button" style="min-height: 52px; border-radius: 16px; border: 1.5px solid #0F5E5E; background: #FFFFFF; color: #0F5E5E; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Kirim ke ustaz untuk dikoreksi</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const g = [4, 6, 8, 12, 22, 30, 28, 20, 14, 10, 8, 6, 5, 4, 4, 4, 5, 18, 26, 14, 6, 4, 3, 3, 3, 3, 3, 3, 3, 3];
    const u = [3, 5, 7, 10, 18, 26, 30, 24, 16, 12, 9, 7, 6, 5, 4, 4, 4, 6, 9, 5, 4, 3, 3, 3, 3, 3, 3, 3, 3, 3];
    const bar = (c) => (h) => 'width: 4px; height: ' + h + 'px; border-radius: 2px; background: ' + c + ';';
    const recorded = !this.state || this.state.rec !== false;
    return {
      guru: g.map(bar('#0F5E5E')),
      saya: u.map(bar('#B57F14')),
      recorded,
      notRecorded: !recorded,
      recLabel: recorded ? 'Rekam ulang' : 'Tekan untuk merekam',
      recBg: recorded ? '#1C2333' : '#B4321F',
      toggle: () => this.setState({ rec: !recorded })
    };
  }
}
</script>
</body>
</html>
