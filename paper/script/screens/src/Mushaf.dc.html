<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Mushaf dengan sorot huruf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E5E}a:hover{color:#0A4444}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF8F2; font-family: 'Plus Jakarta Sans', sans-serif; color: #1C2333; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 700">Al-Fatihah</span>
        <span style="font-size: 12px; color: #5A6070">Surah ke-1 · 7 ayat</span>
      </div>
      <button type="button" aria-label="Putar murottal" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #DCEDEA; color: #0F5E5E; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
      </button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E1D3; border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px">
      <span lang="ar" style="width: 36px; height: 36px; border-radius: 10px; background: #F6E7C8; color: #7A520C; display: flex; align-items: center; justify-content: center; font-family: 'Noto Naskh Arabic', serif; font-size: 22px; font-weight: 700">ب</span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14px; font-weight: 700">Sorot huruf yang baru dipelajari</span>
        <span style="font-size: 12px; color: #5A6070">{{countLabel}}</span>
      </div>
      <button type="button" role="switch" aria-checked="{{onAria}}" aria-label="Sorot huruf ba" onClick="{{toggle}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: {{trackBg}}; padding: 3px; display: flex; justify-content: {{knobPos}}; cursor: pointer">
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; display: block"></span>
      </button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E8E1D3; border-radius: 20px; padding: 18px 16px; display: flex; flex-direction: column; gap: 6px" lang="ar" dir="rtl">
      <sc-for list="{{ayat}}" as="ay" hint-placeholder-count="7">
        <div style="display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-family: 'Noto Naskh Arabic', serif; font-size: 23px; line-height: 1.9; color: #1C2333">
          <sc-for list="{{ay.words}}" as="w" hint-placeholder-count="4">
            <span style="{{w.style}}">{{w.t}}</span>
          </sc-for>
          <span style="font-size: 18px; color: #0F5E5E">{{ay.end}}</span>
        </div>
      </sc-for>
    </div>

    <a href="Pelajaran.dc.html" style="min-height: 48px; border-radius: 14px; background: #F6E7C8; color: #5A3E08; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700">Ulangi pelajaran huruf ب</a>
  </div>

  <nav aria-label="Navigasi utama" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E8E1D3; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6070; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
      Beranda
    </a>
    <a href="Peta.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6070; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14"></path><path d="M15 6v14"></path></svg>
      Tahsin
    </a>
    <a href="Mushaf.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0F5E5E; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"></path><path d="M12 6v13.5"></path></svg>
      Mushaf
    </a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6070; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      Profil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = !this.state || this.state.on !== false;
    const src = [
      ['بِسْمِ', 'ٱللَّهِ', 'ٱلرَّحْمَٰنِ', 'ٱلرَّحِيمِ'],
      ['ٱلْحَمْدُ', 'لِلَّهِ', 'رَبِّ', 'ٱلْعَٰلَمِينَ'],
      ['ٱلرَّحْمَٰنِ', 'ٱلرَّحِيمِ'],
      ['مَٰلِكِ', 'يَوْمِ', 'ٱلدِّينِ'],
      ['إِيَّاكَ', 'نَعْبُدُ', 'وَإِيَّاكَ', 'نَسْتَعِينُ'],
      ['ٱهْدِنَا', 'ٱلصِّرَٰطَ', 'ٱلْمُسْتَقِيمَ'],
      ['صِرَٰطَ', 'ٱلَّذِينَ', 'أَنْعَمْتَ', 'عَلَيْهِمْ', 'غَيْرِ', 'ٱلْمَغْضُوبِ', 'عَلَيْهِمْ', 'وَلَا', 'ٱلضَّآلِّينَ']
    ];
    const nums = ['١', '٢', '٣', '٤', '٥', '٦', '٧'];
    const hl = 'background: #F6E7C8; color: #5A3E08; border-radius: 8px; padding: 0 6px; box-shadow: inset 0 -3px 0 #E2A93B;';
    const plain = 'padding: 0 2px;';
    let count = 0;
    const ayat = src.map((ws, i) => ({
      end: '﴿' + nums[i] + '﴾',
      words: ws.map((t) => {
        const has = t.indexOf('ب') !== -1;
        if (has) count += 1;
        return { t, style: on && has ? hl : plain };
      })
    }));
    return {
      ayat,
      countLabel: on ? count + ' kata dengan huruf ب di surah ini' : 'Sorotan dimatikan',
      onAria: on ? 'true' : 'false',
      trackBg: on ? '#0F5E5E' : '#B9B2A3',
      knobPos: on ? 'flex-end' : 'flex-start',
      toggle: () => this.setState({ on: !on })
    };
  }
}
</script>
</body>
</html>
